# ============================================================================
# yazi.toml —— yazi 文件管理器用户配置
# 版本适配：yazi 26.x
# 说明：yazi 的配置采用"逐项覆盖合并"机制，本文件只写需要调整的部分，
#       未列出的项（如 open/reveal/play 等默认 opener）自动沿用内置默认值。
# ============================================================================

# ---------------------------------------------------------------------------
# 管理器界面
# ---------------------------------------------------------------------------
[mgr]
# 文件名排序：natural 使 file2 排在 file10 之前（数字按大小而不是字典序）
sort_by        = "natural"
# 排序不区分大小写
sort_sensitive = false
# 目录始终排在文件前面
sort_dir_first = true
# 默认显示隐藏文件（.git、.env 等，对开发场景更友好）
# 随时可按 `.` 键临时切换显示/隐藏
show_hidden    = true

# ---------------------------------------------------------------------------
# 预览面板
# ---------------------------------------------------------------------------
[preview]
# 代码预览不自动换行
wrap          = "no"
# 预览中 Tab 键缩进宽度
tab_size      = 4
# 图片预览最大尺寸（默认 600x900，调大后预览更清晰；修改后需 ya cache clear）
max_width     = 1000
max_height    = 1000
# 图片缩放滤镜：lanczos3 质量最好（代价是稍慢，本地预览无感知）
image_filter  = "lanczos3"
# 图片预览缓存质量（范围 50-90）
image_quality = 80

# ---------------------------------------------------------------------------
# 打开方式（opener）
# ---------------------------------------------------------------------------
[opener]
# 默认编辑器改为 Neovim：在文件上按 o / 回车编辑时使用
# block = true：yazi 隐藏自身、让 nvim 独占终端，退出 nvim 后自动返回
edit = [
	{ run = "nvim %s", desc = "nvim", block = true },
]

# ---------------------------------------------------------------------------
# 文件类型 → 打开方式规则
# prepend_rules 插入到内置规则之前，命中后优先于默认规则
# ---------------------------------------------------------------------------
[open]
prepend_rules = [
	# 文件夹：直接交给系统资源管理器（避免 nvim 接管目录后进入 netrw）
	{ mime = "folder/*", use = [ "open", "reveal" ] },
	# 常见代码/配置文件：默认用 nvim 编辑（o = nvim，O = 弹出选择菜单）
	{ url = "*.{js,jsx,ts,tsx,py,rs,go,java,c,cpp,cc,h,hpp,cs,sh,ps1,psm1,bat,cmd,kt,kts,swift,rb,php,lua,sql,html,css,scss,less,vue,svelte,md,mdx,txt,json,jsonc,json5,toml,yaml,yml,ini,cfg,conf,env,properties,xml,editorconfig,gitignore,gitattributes}", use = [ "edit", "reveal" ] },
]

# ---------------------------------------------------------------------------
# 后台任务
# ---------------------------------------------------------------------------
[tasks]
# 并行文件操作数（复制/移动/删除），默认 3，现代磁盘可适当调高
file_workers     = 5
# 图片/视频/PDF 预览预加载并发数，默认 2，调高加快滚动预览
preload_workers  = 4
# 不在任务管理器中显示后台预加载任务，减少干扰（按 w 打开任务管理器）
suppress_preload = true
# 单张图片解码的最大像素限制（宽、高），防止超大图解码吃满内存
image_bound      = [ 4096, 4096 ]

# ---------------------------------------------------------------------------
# 输入框（重命名 / 搜索 / 过滤等）
# ---------------------------------------------------------------------------
[input]
# 光标闪烁，符合 vim 使用习惯
cursor_blink = true
